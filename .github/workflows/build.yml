name: Build ShitOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm make gcc binutils

      - name: Build with Makefile
        run: make

      - name: Upload OS image
        uses: actions/upload-artifact@v4
        with:
          name: shitos-image
          path: os-image.bin
          if-no-files-found: error
